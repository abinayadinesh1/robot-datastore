<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Stream</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="webrtc.js"></script>
</head>
<body class="page-robot">

<div class="grid-bg">
  <div class="grid-canvas">
    <div class="grid-plane">
      <div class="grid-vlines"></div>
      <div class="grid-hlines"></div>
      <div class="grid-axis-h"></div>
      <div class="grid-axis-v"></div>
    </div>
    <div class="grid-scan"></div>
  </div>
  <div class="grid-fade"></div>
  <div class="grid-topfade"></div>
</div>

<header>
  <div class="h-left">
    <a class="btn-back" href="index.html">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
      All Streams
    </a>
    <div class="h-sep"></div>
    <span class="h-label" id="header-label"></span>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">connecting</span>
    </div>
  </div>
</header>

<main>
  <div>
    <div class="stream-label" id="main-label"></div>
    <div class="stream-sublabel" id="fig-sub"></div>
  </div>

  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-live">Live Feed</button>
    <button class="mode-btn" id="btn-view">View Mode</button>
    <button class="mode-btn" id="btn-settings">Settings</button>
  </div>

  <!-- Live feed container -->
  <div id="live-container">
    <div class="stream-box" id="stream-box">
      <div class="status-overlay" id="status-overlay">
        <div class="status-cross">
          <div class="status-cline-h"></div>
          <div class="status-cline-v"></div>
        </div>
        <span class="status-text" id="overlay-text">Acquiring</span>
      </div>
      <video id="stream-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:contain;display:block;"></video>
    </div>
    <div class="stream-url-bar" id="url-bar"></div>
    <div class="fig-label" id="fig-label"></div>
  </div>

  <!-- View mode container (hidden by default) -->
  <div id="view-container" style="display:none;">

    <!-- Collection dropdown (top-right) -->
    <div class="collection-dropdown" id="collection-dropdown">
      <button class="btn-ghost" id="btn-collections">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-2px;margin-right:4px;"><path d="M1 2h14v2H1zm2 3h10v2H3zm2 3h6v2H5zm2 3h2v2H7z"/></svg>
        Data Collection Tasks
      </button>
      <div class="dropdown-menu" id="collection-menu" style="display:none;">
        <div id="collection-list"></div>
        <div class="dropdown-sep"></div>
        <div id="new-collection-form" style="display:none;padding:8px 12px;">
          <input type="text" id="new-collection-input" class="input-sm" placeholder="Collection name">
          <button class="btn-primary-sm" id="btn-create-collection">Create</button>
        </div>
        <button class="dropdown-item" id="btn-new-collection" style="color:var(--ink);font-weight:600;">+ New Collection</button>
      </div>
    </div>

    <!-- Date selector button -->
    <div class="date-selector">
      <button class="btn-ghost" id="btn-date-select">Select start and end date</button>
      <span id="segment-count" class="text-dim" style="margin-left:8px;"></span>
      <button class="btn-ghost" id="btn-ask-question" style="margin-left:12px;">Ask a Question</button>
      <div class="question-inline" id="question-panel" style="display:none;">
        <input type="text" id="question-input" class="question-input" placeholder="Ask about this time interval...">
        <button class="btn-primary-sm" id="btn-submit-question" disabled>Submit</button>
      </div>
      <div id="qa-progress" style="display:none; margin-top:8px; padding:12px 16px; border:1px solid var(--border); border-radius:4px; background:var(--cream); font-family:'IBM Plex Mono',monospace; font-size:13px;">
        <div id="qa-status" style="color:var(--text-dim); margin-bottom:4px;"></div>
        <div id="qa-answer" style="display:none; margin-top:8px; padding:12px; border:1px solid var(--border-hi); border-radius:4px; background:white; line-height:1.6;"></div>
      </div>
    </div>

    <!-- Calendar overlay -->
    <div class="cal-overlay" id="cal-overlay" style="display:none;">
      <div class="cal-overlay-backdrop" id="cal-backdrop"></div>
      <div class="data-calendar" id="data-calendar">
        <div class="cal-nav">
          <button class="btn-ghost cal-nav-btn" id="cal-prev">&#x2039;</button>
          <span class="cal-month-label" id="cal-month-label"></span>
          <button class="btn-ghost cal-nav-btn" id="cal-next">&#x203a;</button>
        </div>
        <div class="cal-weekdays">
          <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

    <!-- Playback area -->
    <div class="stream-box" id="playback-box">
      <div class="status-overlay" id="playback-overlay">
        <div class="status-cross"><div class="status-cline-h"></div><div class="status-cline-v"></div></div>
        <span class="status-text" id="playback-overlay-text">Select a date range</span>
      </div>
      <video id="playback-video" preload="metadata" style="display:none;width:100%;height:100%;object-fit:contain;"></video>
      <img id="playback-img" style="display:none;width:100%;height:100%;object-fit:contain;" alt="idle frame">
    </div>

    <!-- Scrubber -->
    <div class="scrubber-container" id="scrubber-container">
      <div class="scrubber-track" id="scrubber-track">
        <!-- Segment blocks rendered dynamically -->
      </div>
      <div class="scrubber-handle" id="scrubber-handle" style="left:0;"></div>
      <!-- Clip selection (hidden until double-click) -->
      <div class="clip-range" id="clip-range" style="display:none;">
        <div class="clip-handle clip-start" id="clip-start-handle"></div>
        <div class="clip-handle clip-end" id="clip-end-handle"></div>
      </div>
    </div>
    <div class="scrubber-times">
      <span id="scrubber-time-current">--:--:--</span>
      <span id="scrubber-time-total">--:--:--</span>
    </div>

    <!-- Playback controls -->
    <div class="playback-controls">
      <button class="btn-ghost" id="btn-play">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>
        Play
      </button>
      <button class="btn-ghost" id="btn-pause" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg>
        Pause
      </button>
      <span class="text-dim" id="time-display"></span>
    </div>

    <!-- Segment info bar (shown when viewing a segment) -->
    <div class="segment-info-bar" id="segment-info-bar" style="display:none;">
      <span class="segment-info-text" id="segment-info-text"></span>
      <button class="btn-delete-segment" id="btn-delete-segment">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 010-2H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM6 1.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5z"/></svg>
        Delete Segment
      </button>
    </div>

    <!-- Label & save bar (shown when clip selected) -->
    <div class="label-bar" id="label-bar" style="display:none;">
      <div class="clip-info" id="clip-info"></div>
      <input type="text" id="label-input" class="input-sm" placeholder="Labels (comma separated)">
      <button class="btn-primary-sm" id="btn-save-clip">Save to Collection</button>
      <button class="btn-delete-segment" id="btn-delete-selection">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 010-2H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM6 1.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5z"/></svg>
        Delete Selection
      </button>
    </div>

    <!-- Download bar (shown when collection selected) -->
    <div class="download-bar" id="download-bar" style="display:none;">
      <span id="download-collection-name"></span>
      <span class="text-dim" id="download-size"></span>
      <button class="btn-ghost" id="btn-download-zip">Download Segments (ZIP)</button>
      <button class="btn-ghost" id="btn-download-mp4">Download Stitched (MP4)</button>
    </div>
  </div>

  <!-- Settings container (hidden by default) -->
  <div id="settings-container" style="display:none;">
    <div class="settings-panel">
      <div class="settings-header">Filter Parameters</div>
      <div class="settings-sub">Changes apply instantly to all running pipelines</div>

      <div class="setting-group">
        <div class="setting-group-title">pHash Filter (JPEG)</div>

        <div class="setting-row">
          <label class="setting-label" for="s-phash-threshold">
            phash_threshold
            <span class="setting-hint">Hamming distance (0-256). Higher = less sensitive. If you expect movement to happen in a small set of your whole image, keep this smaller so it picks up on the changes. </span>
          </label>
          <div class="setting-control">
            <input type="range" id="s-phash-threshold" min="0" max="128" step="1" value="20">
            <span class="setting-value" id="v-phash-threshold">20</span>
          </div>
        </div>

        <div class="setting-row">
          <label class="setting-label" for="s-phash-hash-size">
            phash_hash_size
            <span class="setting-hint">Hash grid NxN. 16 = 256 bits. Larger = more detail.</span>
          </label>
          <div class="setting-control">
            <input type="range" id="s-phash-hash-size" min="4" max="32" step="2" value="16">
            <span class="setting-value" id="v-phash-hash-size">16</span>
          </div>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">Motion Filter (H.264)</div>

        <div class="setting-row">
          <label class="setting-label" for="s-motion-threshold">
            motion_threshold
            <span class="setting-hint">Motion ratio above this = active. (0.0 - 1.0)</span>
          </label>
          <div class="setting-control">
            <input type="range" id="s-motion-threshold" min="0" max="1" step="0.005" value="0.05">
            <span class="setting-value" id="v-motion-threshold">0.050</span>
          </div>
        </div>

        <div class="setting-row">
          <label class="setting-label" for="s-quiet-threshold">
            quiet_threshold
            <span class="setting-hint">Motion ratio below this = quiet (idle). Should be &lt; motion.</span>
          </label>
          <div class="setting-control">
            <input type="range" id="s-quiet-threshold" min="0" max="1" step="0.005" value="0.02">
            <span class="setting-value" id="v-quiet-threshold">0.020</span>
          </div>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-group-title">Histogram Filter</div>

        <div class="setting-row">
          <label class="setting-label" for="s-histogram-threshold">
            histogram_threshold
            <span class="setting-hint">Chi-squared distance threshold. (0.0 - 1.0)</span>
          </label>
          <div class="setting-control">
            <input type="range" id="s-histogram-threshold" min="0" max="1" step="0.01" value="0.15">
            <span class="setting-value" id="v-histogram-threshold">0.15</span>
          </div>
        </div>
      </div>

      <div class="settings-status" id="settings-status"></div>
    </div>
  </div>
</main>

<script>
// ── URL Params ───────────────────────────────────────────────────────────
function getParam(name){
  return new URLSearchParams(window.location.search).get(name)||'';
}

const label     = getParam('label') || 'Robot Camera';
const url       = getParam('url');
const webrtcUrl = getParam('webrtc_url');
const robotId   = getParam('robot_id') || 'reachy-001';
const initMode  = getParam('mode') || 'live';
let apiBase     = 'http://100.81.222.59:8080'; // fallback; overridden by sources.json
(async () => {
  try {
    const res = await fetch('sources.json');
    const data = await res.json();
    if (data.api_url) apiBase = data.api_url;
  } catch (_) {}
})();

// ── Populate UI labels ───────────────────────────────────────────────────
document.title = label + ' — Stream Viewer';
document.getElementById('header-label').textContent = label;
document.getElementById('main-label').textContent   = label;
document.getElementById('url-bar').textContent      = webrtcUrl || url;
document.getElementById('fig-sub').textContent      = 'live feed';
const idx = Math.floor(Math.random()*999)+1;
document.getElementById('fig-label').textContent = `FIG.${String(idx).padStart(3,'0')} — ${label.toUpperCase()}`;

// ── View state ───────────────────────────────────────────────────────────
const vs = {
  mode: 'live',
  segments: [],
  timeBounds: null,
  rangeStartMs: null,
  rangeEndMs: null,
  currentSegmentIdx: -1,
  isPlaying: false,
  clipSelection: null,    // { startMs, endMs }
  activeCollection: null, // { id, name }
  collections: [],
};

// ── DOM refs ─────────────────────────────────────────────────────────────
const $liveContainer  = document.getElementById('live-container');
const $viewContainer  = document.getElementById('view-container');
const $btnLive        = document.getElementById('btn-live');
const $btnView        = document.getElementById('btn-view');
const $calOverlay     = document.getElementById('cal-overlay');
const $btnDateSelect  = document.getElementById('btn-date-select');
const $segCount       = document.getElementById('segment-count');
const $playbackBox    = document.getElementById('playback-box');
const $playbackOverlay= document.getElementById('playback-overlay');
const $playbackOvText = document.getElementById('playback-overlay-text');
const $video          = document.getElementById('playback-video');
const $img            = document.getElementById('playback-img');
const $scrubTrack     = document.getElementById('scrubber-track');
const $scrubHandle    = document.getElementById('scrubber-handle');
const $clipRange      = document.getElementById('clip-range');
const $clipStartH     = document.getElementById('clip-start-handle');
const $clipEndH       = document.getElementById('clip-end-handle');
const $timeCurrent    = document.getElementById('scrubber-time-current');
const $timeTotal      = document.getElementById('scrubber-time-total');
const $btnPlay        = document.getElementById('btn-play');
const $btnPause       = document.getElementById('btn-pause');
const $timeDisplay    = document.getElementById('time-display');
const $labelBar       = document.getElementById('label-bar');
const $clipInfo       = document.getElementById('clip-info');
const $labelInput     = document.getElementById('label-input');
const $collectionMenu = document.getElementById('collection-menu');
const $collectionList = document.getElementById('collection-list');
const $downloadBar    = document.getElementById('download-bar');

// ── Helpers ──────────────────────────────────────────────────────────────
function msToTime(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('en-GB', { hour12: false });
}
function msToDateStr(ms) {
  return new Date(ms).toISOString().slice(0, 10);
}
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(2) + ' GB';
}

// ── Mode toggle ──────────────────────────────────────────────────────────
$btnLive.addEventListener('click', () => switchMode('live'));
$btnView.addEventListener('click', () => switchMode('view'));

function switchMode(mode) {
  vs.mode = mode;
  $btnLive.classList.toggle('active', mode === 'live');
  $btnView.classList.toggle('active', mode === 'view');
  document.getElementById('btn-settings').classList.toggle('active', mode === 'settings');
  $liveContainer.style.display = mode === 'live' ? '' : 'none';
  $viewContainer.style.display = mode === 'view' ? '' : 'none';
  document.getElementById('settings-container').style.display = mode === 'settings' ? '' : 'none';
  const subs = { live: 'live feed', view: 'view mode', settings: 'filter tuning' };
  document.getElementById('fig-sub').textContent = subs[mode] || mode;

  if (mode === 'view') {
    fetchCollections();
    fetchActiveDates();
  } else if (mode === 'settings') {
    fetchFilterConfig();
  } else {
    stopPlayback();
  }
}

// ── Live feed (WebRTC with MJPEG fallback) ───────────────────────────────
if(!url && !webrtcUrl){
  document.getElementById('overlay-text').textContent = 'No URL provided';
  document.getElementById('status-dot').style.background='#ff3355';
  document.getElementById('status-text').textContent='error';
} else {
  const videoEl = document.getElementById('stream-video');
  const overlay = document.getElementById('status-overlay');
  const dot     = document.getElementById('status-dot');
  const stText  = document.getElementById('status-text');
  const ovText  = document.getElementById('overlay-text');

  let retryDelay=2000, retryTimer=null, countdown=null;

  function setLive(){
    overlay.style.display='none';
    dot.style.background='var(--green)'; stText.textContent='live';
  }
  function setConnecting(){
    overlay.style.display='flex';
    overlay.querySelector('.status-cross').style.animation='rotateCross 3s linear infinite';
    ovText.textContent='Acquiring';
    dot.style.background='var(--amber)'; stText.textContent='connecting';
  }
  function setError(secs){
    overlay.style.display='flex';
    overlay.querySelector('.status-cross').style.animation='none';
    ovText.textContent=secs>0?`Retry in ${secs}s`:'Reconnecting';
    dot.style.background='#ff3355'; stText.textContent=secs>0?`retry ${secs}s`:'reconnecting';
  }

  function startMjpegFallback(){
    // Replace <video> with <img> for MJPEG
    const img=document.createElement('img');
    img.style.cssText='width:100%;height:100%;object-fit:contain;display:block;';
    img.alt=label;img.loading='eager';
    videoEl.replaceWith(img);
    img.onload=()=>{clearTimeout(retryTimer);clearInterval(countdown);retryDelay=2000;setLive();};
    img.onerror=()=>{
      clearTimeout(retryTimer);clearInterval(countdown);
      let secs=Math.round(retryDelay/1000);setError(secs);
      countdown=setInterval(()=>{secs--;ovText.textContent=secs>0?`Retry in ${secs}s`:'Reconnecting';stText.textContent=secs>0?`retry ${secs}s`:'reconnecting';},1000);
      retryTimer=setTimeout(()=>{clearInterval(countdown);setConnecting();const sep=url.includes('?')?'&':'?';img.src=url+sep+'_t='+Date.now();retryDelay=Math.min(retryDelay*2,30000);},retryDelay);
    };
    img.src=url;
  }

  if(webrtcUrl){
    setConnecting();
    let webrtcTimeout=setTimeout(()=>{
      console.warn('WebRTC timeout, falling back to MJPEG');
      if(url) startMjpegFallback();
    },10000);

    connectWebRTC(videoEl,webrtcUrl,{
      onConnected:()=>{clearTimeout(webrtcTimeout);retryDelay=2000;setLive();},
      onDisconnected:()=>{clearTimeout(webrtcTimeout);if(url)startMjpegFallback();},
      onError:(err)=>{clearTimeout(webrtcTimeout);console.warn('WebRTC error:',err);if(url)startMjpegFallback();}
    });
  } else {
    startMjpegFallback();
  }
}

// ── Timeline / segment loading ───────────────────────────────────────────
async function loadTimeline() {
  if (!calSelectStart) return;
  const startDate = calSelectStart;
  const endDate   = calSelectEnd || calSelectStart;

  const startMs = new Date(startDate).getTime();
  const endMs   = new Date(endDate + 'T23:59:59.999').getTime();
  vs.rangeStartMs = startMs;
  vs.rangeEndMs   = endMs;

  $playbackOvText.textContent = 'Loading...';
  $playbackOverlay.style.display = 'flex';

  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/timeline?start_ms=${startMs}&end_ms=${endMs}&limit=1000`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    vs.segments   = data.segments;
    vs.timeBounds = data.time_bounds;
    $segCount.textContent = `${vs.segments.length} segments`;

    if (vs.segments.length === 0) {
      $playbackOvText.textContent = 'No data in this range';
      $scrubTrack.innerHTML = '';
      return;
    }

    renderScrubber();
    $playbackOverlay.style.display = 'none';
    const firstSeg = vs.segments[0];
    const lastSeg  = vs.segments[vs.segments.length - 1];
    $timeCurrent.textContent = msToTime(firstSeg.start_ms);
    $timeTotal.textContent   = msToTime(lastSeg.end_ms);

    // Seek to first segment
    seekToTimestamp(firstSeg.start_ms);
  } catch (e) {
    $playbackOvText.textContent = 'Error loading timeline';
    console.error('Timeline load error:', e);
  }
}

// ── Scrubber rendering ───────────────────────────────────────────────────
function formatDuration(ms) {
  const totalSec = Math.round(ms / 1000);
  if (totalSec < 60) return totalSec + 's';
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return s > 0 ? m + 'm ' + s + 's' : m + 'm';
}

function renderScrubber() {
  $scrubTrack.innerHTML = '';
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;
  if (totalMs <= 0) return;

  for (const seg of vs.segments) {
    const left  = ((seg.start_ms - vs.rangeStartMs) / totalMs) * 100;
    const width = ((seg.end_ms - seg.start_ms) / totalMs) * 100;

    if (seg.type === 'active') {
      const el = document.createElement('div');
      el.className = 'scrubber-segment active';
      el.style.left  = Math.max(0, left) + '%';
      el.style.width = Math.max(0.2, width) + '%';
      el.title = `${msToTime(seg.start_ms)} - ${msToTime(seg.end_ms)}`;
      $scrubTrack.appendChild(el);
    } else {
      // Idle flag marker
      const flag = document.createElement('div');
      flag.className = 'scrubber-idle-flag';
      flag.style.left = Math.max(0, left) + '%';
      const dur = seg.end_ms - seg.start_ms;
      flag.textContent = 'idle: ' + formatDuration(dur);
      flag.title = `${msToTime(seg.start_ms)} - ${msToTime(seg.end_ms)}`;
      $scrubTrack.appendChild(flag);
    }
  }
}

// ── Scrubber drag ────────────────────────────────────────────────────────
let scrubDragging = false;
let pendingScrubTs = null;

$scrubHandle.addEventListener('mousedown', (e) => { scrubDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!scrubDragging) return;
  // Update visual position only — defer the actual video seek to mouseup to prevent jitter.
  const rect = $scrubTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  pendingScrubTs = vs.rangeStartMs + pct * (vs.rangeEndMs - vs.rangeStartMs);
  $scrubHandle.style.left = (pct * 100) + '%';
  $timeCurrent.textContent = msToTime(pendingScrubTs);
});
document.addEventListener('mouseup', () => {
  if (scrubDragging && pendingScrubTs !== null) {
    seekToTimestamp(pendingScrubTs);
    pendingScrubTs = null;
    startPlayback();
  }
  scrubDragging = false;
});

$scrubTrack.addEventListener('click', (e) => {
  if (e.target.classList.contains('clip-handle')) return;
  scrubToX(e.clientX);
});

function scrubToX(clientX) {
  const rect = $scrubTrack.getBoundingClientRect();
  const pct  = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;
  const ts = vs.rangeStartMs + pct * totalMs;
  $scrubHandle.style.left = (pct * 100) + '%';
  $timeCurrent.textContent = msToTime(ts);
  seekToTimestamp(ts);
  startPlayback();
}

// ── Seek to timestamp ────────────────────────────────────────────────────
function seekToTimestamp(ts) {
  // Find which segment contains this timestamp
  let segIdx = -1;
  for (let i = 0; i < vs.segments.length; i++) {
    const s = vs.segments[i];
    if (ts >= s.start_ms && ts <= s.end_ms) { segIdx = i; break; }
  }
  // If not in any segment, find nearest
  if (segIdx === -1) {
    let minDist = Infinity;
    for (let i = 0; i < vs.segments.length; i++) {
      const mid = (vs.segments[i].start_ms + vs.segments[i].end_ms) / 2;
      const d = Math.abs(ts - mid);
      if (d < minDist) { minDist = d; segIdx = i; }
    }
  }
  if (segIdx === -1) return;

  const seg = vs.segments[segIdx];
  vs.currentSegmentIdx = segIdx;

  // Sync scrubber handle and time label for any seek, including idle segments.
  const clampedTs = Math.max(seg.start_ms, Math.min(seg.end_ms, ts));
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;
  const pct = (clampedTs - vs.rangeStartMs) / totalMs;
  $scrubHandle.style.left = (Math.max(0, Math.min(1, pct)) * 100) + '%';
  $timeCurrent.textContent = msToTime(clampedTs);

  if (seg.type === 'active') {
    showVideo(seg, ts);
  } else {
    // Scrubbed into an idle gap — snap to the nearest active segment
    const nextActive = vs.segments.find((s, i) => i > segIdx && s.type === 'active');
    const prevActive = vs.segments.slice(0, segIdx).reverse().find(s => s.type === 'active');
    const snapSeg = nextActive || prevActive;
    if (snapSeg) {
      vs.currentSegmentIdx = vs.segments.indexOf(snapSeg);
      const snapTs = snapSeg === nextActive ? snapSeg.start_ms : snapSeg.end_ms - 100;
      updateScrubberPosition(snapTs);
      showVideo(snapSeg, snapTs);
    } else {
      $playbackOvText.textContent = 'No video segments';
      $playbackOverlay.style.display = 'flex';
    }
  }
}

function showVideo(seg, ts) {
  updateSegmentInfoBar(seg);
  const videoUrl = `${apiBase}/robots/${robotId}/segments/${seg.id}/video`;
  $img.style.display = 'none';
  $video.style.display = 'block';

  // Clear stale handlers so a previous playFromCurrent doesn't snap the scrubber back.
  $video.ontimeupdate = null;
  $video.onended = null;

  // Only reload if different segment
  if ($video.dataset.segId !== String(seg.id)) {
    $video.dataset.segId = String(seg.id);
    $video.src = videoUrl;
    $video.addEventListener('loadedmetadata', () => {
      const offset = Math.max(0, (ts - seg.start_ms) / 1000);
      $video.currentTime = offset;
    }, { once: true });
  } else {
    const offset = Math.max(0, (ts - seg.start_ms) / 1000);
    $video.currentTime = offset;
  }
  $playbackOverlay.style.display = 'none';
}

function showIdleImage(seg) {
  $video.style.display = 'none';
  $video.pause();
  $img.style.display = 'block';
  $img.onerror = null;

  // H.264 idle segments store a synthetic key ("idle:start/end") — no JPEG was uploaded.
  // Show an overlay instead of a broken image icon.
  if (!seg.s3_key || seg.s3_key.startsWith('idle:')) {
    $img.src = '';
    $playbackOvText.textContent = 'No snapshot (motion-quiet period)';
    $playbackOverlay.style.display = 'flex';
    return;
  }

  $playbackOverlay.style.display = 'none';
  const imageUrl = `${apiBase}/robots/${robotId}/segments/${seg.id}/image`;
  $img.onerror = () => {
    $img.onerror = null;
    $img.src = '';
    $playbackOvText.textContent = 'Could not load snapshot';
    $playbackOverlay.style.display = 'flex';
  };
  $img.src = imageUrl;
}

// ── Playback engine ──────────────────────────────────────────────────────
let playbackTimer = null;

$btnPlay.addEventListener('click', startPlayback);
$btnPause.addEventListener('click', stopPlayback);

function startPlayback() {
  vs.isPlaying = true;
  $btnPlay.style.display = 'none';
  $btnPause.style.display = '';

  if (vs.clipSelection) {
    playClipRange();
  } else {
    playFromCurrent();
  }
}

function stopPlayback() {
  vs.isPlaying = false;
  $btnPlay.style.display = '';
  $btnPause.style.display = 'none';
  $video.pause();
  clearTimeout(playbackTimer);
}

function playFromCurrent() {
  if (!vs.isPlaying || vs.currentSegmentIdx < 0) return;
  const seg = vs.segments[vs.currentSegmentIdx];

  // Skip idle segments — jump straight to next active segment
  if (seg.type !== 'active') {
    advanceToNextSegment(vs.currentSegmentIdx + 1);
    return;
  }

  const wasSameSeg = $video.dataset.segId === String(seg.id);

  if (!wasSameSeg) {
    showVideo(seg, seg.start_ms);
    $video.addEventListener('canplay', function onReady() {
      $video.removeEventListener('canplay', onReady);
      if (vs.isPlaying) {
        $video.play().catch(e => { if (e.name !== 'AbortError') console.warn('play() error:', e); });
      }
    });
  } else {
    $video.play().catch(e => { if (e.name !== 'AbortError') console.warn('play() error:', e); });
  }

  $video.onended = () => advanceToNextSegment(vs.currentSegmentIdx + 1);
  $video.ontimeupdate = () => {
    if (!vs.isPlaying) return;
    const currentTs = seg.start_ms + $video.currentTime * 1000;
    updateScrubberPosition(currentTs);
  };
}

function advanceToNextSegment(nextIdx) {
  if (!vs.isPlaying) return;

  // If playing a clip range, check if we've exceeded the clip end
  if (vs.clipSelection) {
    if (nextIdx >= vs.segments.length || vs.segments[nextIdx].start_ms >= vs.clipSelection.endMs) {
      stopPlayback();
      return;
    }
  }

  if (nextIdx >= vs.segments.length) {
    stopPlayback();
    return;
  }

  vs.currentSegmentIdx = nextIdx;
  const seg = vs.segments[nextIdx];

  // Skip gaps (jump to next segment)
  playFromCurrent();
}

function playClipRange() {
  if (!vs.clipSelection || !vs.isPlaying) return;
  const { startMs, endMs } = vs.clipSelection;

  // Find first segment that overlaps clip start
  let startIdx = vs.segments.findIndex(s => s.end_ms > startMs);
  if (startIdx === -1) { stopPlayback(); return; }

  vs.currentSegmentIdx = startIdx;
  const seg = vs.segments[startIdx];

  // Skip idle segments in clip playback too
  if (seg.type !== 'active') {
    advanceToNextSegment(vs.currentSegmentIdx + 1);
    return;
  }

  const seekTs = Math.max(startMs, seg.start_ms);
  const wasSameSeg = $video.dataset.segId === String(seg.id);
  showVideo(seg, seekTs);

  const doPlay = () => {
    $video.play().catch(e => { if (e.name !== 'AbortError') console.warn('play() error:', e); });
  };

  if (!wasSameSeg) {
    $video.addEventListener('canplay', function onReady() {
      $video.removeEventListener('canplay', onReady);
      if (vs.isPlaying) doPlay();
    });
  } else {
    doPlay();
  }

  $video.ontimeupdate = () => {
    if (!vs.isPlaying) return;
    const currentTs = seg.start_ms + $video.currentTime * 1000;
    updateScrubberPosition(currentTs);
    if (currentTs >= endMs) {
      stopPlayback();
    } else if (currentTs >= seg.end_ms) {
      advanceToNextSegment(vs.currentSegmentIdx + 1);
    }
  };
  $video.onended = () => advanceToNextSegment(vs.currentSegmentIdx + 1);
}

function updateScrubberPosition(ts) {
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;
  if (totalMs <= 0) return;
  const pct = (ts - vs.rangeStartMs) / totalMs;
  $scrubHandle.style.left = (pct * 100) + '%';
  $timeCurrent.textContent = msToTime(ts);
}

// ── Clip selection (double-click scrubber) ───────────────────────────────
$scrubTrack.addEventListener('dblclick', (e) => {
  const rect = $scrubTrack.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;
  const centerTs = vs.rangeStartMs + pct * totalMs;

  // Default 10-second range centered on click
  const halfRange = 5000;
  const startMs = Math.max(vs.rangeStartMs, centerTs - halfRange);
  const endMs   = Math.min(vs.rangeEndMs, centerTs + halfRange);

  setClipSelection(startMs, endMs);
});

function setClipSelection(startMs, endMs) {
  vs.clipSelection = { startMs, endMs };
  const totalMs = vs.rangeEndMs - vs.rangeStartMs;

  const startPct = ((startMs - vs.rangeStartMs) / totalMs) * 100;
  const endPct   = ((endMs   - vs.rangeStartMs) / totalMs) * 100;

  $clipRange.style.display = 'block';
  $clipRange.style.left  = startPct + '%';
  $clipRange.style.width = (endPct - startPct) + '%';

  $labelBar.style.display = 'flex';
  $clipInfo.textContent = `Clip: ${msToTime(startMs)} — ${msToTime(endMs)}`;
}

function clearClipSelection() {
  vs.clipSelection = null;
  $clipRange.style.display = 'none';
  $labelBar.style.display  = 'none';
}

// Clip handle dragging
let clipDrag = null; // 'start' | 'end'
$clipStartH.addEventListener('mousedown', (e) => { clipDrag = 'start'; e.preventDefault(); e.stopPropagation(); });
$clipEndH.addEventListener('mousedown',   (e) => { clipDrag = 'end';   e.preventDefault(); e.stopPropagation(); });
document.addEventListener('mousemove', (e) => {
  if (!clipDrag || !vs.clipSelection) return;
  const rect = $scrubTrack.getBoundingClientRect();
  const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const ts   = vs.rangeStartMs + pct * (vs.rangeEndMs - vs.rangeStartMs);
  if (clipDrag === 'start' && ts < vs.clipSelection.endMs) {
    setClipSelection(ts, vs.clipSelection.endMs);
  } else if (clipDrag === 'end' && ts > vs.clipSelection.startMs) {
    setClipSelection(vs.clipSelection.startMs, ts);
  }
});
document.addEventListener('mouseup', () => { clipDrag = null; });

// Press Escape to clear clip selection
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearClipSelection();
  if (e.key === ' ' && vs.mode === 'view' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    vs.isPlaying ? stopPlayback() : startPlayback();
  }
});

// ── Collection management ────────────────────────────────────────────────
document.getElementById('btn-collections').addEventListener('click', () => {
  const vis = $collectionMenu.style.display === 'none';
  $collectionMenu.style.display = vis ? 'block' : 'none';
});
// Close dropdown on outside click
document.addEventListener('click', (e) => {
  if (!document.getElementById('collection-dropdown').contains(e.target)) {
    $collectionMenu.style.display = 'none';
  }
});

document.getElementById('btn-new-collection').addEventListener('click', () => {
  document.getElementById('new-collection-form').style.display = 'flex';
  document.getElementById('new-collection-input').focus();
});

document.getElementById('btn-create-collection').addEventListener('click', createCollection);
document.getElementById('new-collection-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') createCollection();
});

async function fetchCollections() {
  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/collections`);
    if (!resp.ok) return;
    vs.collections = await resp.json();
    renderCollections();
  } catch (e) {
    console.error('Failed to fetch collections:', e);
  }
}

function renderCollections() {
  $collectionList.innerHTML = '';
  for (const c of vs.collections) {
    const el = document.createElement('div');
    el.className = 'dropdown-item' + (vs.activeCollection && vs.activeCollection.id === c.id ? ' selected' : '');
    el.textContent = `${c.name} (${c.clip_count || 0})`;
    el.addEventListener('click', () => selectCollection(c));
    $collectionList.appendChild(el);
  }
}

function selectCollection(c) {
  vs.activeCollection = { id: c.id, name: c.name };
  renderCollections();
  $collectionMenu.style.display = 'none';
  $downloadBar.style.display = 'flex';
  document.getElementById('download-collection-name').textContent = c.name;
  fetchDownloadInfo(c.id);
}

async function createCollection() {
  const input = document.getElementById('new-collection-input');
  const name = input.value.trim();
  if (!name) return;

  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/collections`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert('Error creating collection: ' + msg);
      return;
    }
    const created = await resp.json();
    input.value = '';
    document.getElementById('new-collection-form').style.display = 'none';
    await fetchCollections();
    selectCollection(created);
  } catch (e) {
    console.error('Failed to create collection:', e);
  }
}

async function fetchDownloadInfo(collectionId) {
  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/collections/${collectionId}/download-info`);
    if (!resp.ok) return;
    const info = await resp.json();
    document.getElementById('download-size').textContent = `${info.clip_count} clips · ${formatBytes(info.total_bytes)}`;
  } catch (e) {
    console.error('Failed to fetch download info:', e);
  }
}

// ── Save clip to collection ──────────────────────────────────────────────
document.getElementById('btn-save-clip').addEventListener('click', saveClip);

async function saveClip() {
  if (!vs.clipSelection) { alert('Select a clip range first'); return; }
  if (!vs.activeCollection) { alert('Select a collection first'); return; }

  const { startMs, endMs } = vs.clipSelection;
  const labels = $labelInput.value.split(',').map(s => s.trim()).filter(Boolean);

  // Find all segments overlapping the clip range
  const segmentIds = vs.segments
    .filter(s => s.end_ms > startMs && s.start_ms < endMs)
    .map(s => s.id);

  if (segmentIds.length === 0) { alert('No segments in selected range'); return; }

  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/collections/${vs.activeCollection.id}/clips`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clip_start_ms: Math.round(startMs),
        clip_end_ms: Math.round(endMs),
        segment_ids: segmentIds,
        labels,
      }),
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert('Error saving clip: ' + msg);
      return;
    }
    $labelInput.value = '';
    clearClipSelection();
    fetchDownloadInfo(vs.activeCollection.id);
    fetchCollections();
    // Brief visual feedback
    document.getElementById('btn-save-clip').textContent = 'Saved!';
    setTimeout(() => { document.getElementById('btn-save-clip').textContent = 'Save to Collection'; }, 1500);
  } catch (e) {
    console.error('Failed to save clip:', e);
    alert('Failed to save clip');
  }
}

// ── Download ─────────────────────────────────────────────────────────────
async function downloadMedia(format) {
  if (!vs.activeCollection) return;
  const $btn = document.getElementById(format === 'mp4' ? 'btn-download-mp4' : 'btn-download-zip');
  const $size = document.getElementById('download-size');
  const origText = $btn.textContent;

  // Check size first
  try {
    const infoResp = await fetch(
      `${apiBase}/robots/${robotId}/collections/${vs.activeCollection.id}/download-info`
    );
    if (infoResp.ok) {
      const info = await infoResp.json();
      if (info.clip_count === 0) { alert('No clips in this collection'); return; }
      if (info.total_bytes > 500 * 1024 * 1024) {
        if (!confirm(`This collection is ${formatBytes(info.total_bytes)}. Download may take a while. Continue?`)) return;
      }
    }
  } catch (_) {}

  $btn.textContent = 'Preparing...';
  $btn.disabled = true;

  try {
    const url = `${apiBase}/robots/${robotId}/collections/${vs.activeCollection.id}/download?format=${format}`;
    console.log('[download] fetching', url);
    const resp = await fetch(url);

    if (!resp.ok) {
      const errText = await resp.text();
      console.error('[download] server error', resp.status, errText);
      alert('Download failed (' + resp.status + '): ' + errText);
      return;
    }

    const contentLength = resp.headers.get('Content-Length');
    const total = contentLength ? parseInt(contentLength, 10) : 0;

    // Stream with progress
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        const pct = Math.round((received / total) * 100);
        $btn.textContent = `${pct}%`;
        $size.textContent = `${formatBytes(received)} / ${formatBytes(total)}`;
      } else {
        $btn.textContent = formatBytes(received);
      }
    }

    // Check for missing segments
    const missing = resp.headers.get('X-Missing-Segments');
    if (missing && parseInt(missing) > 0) {
      alert(`Warning: ${missing} segment(s) were unavailable and skipped.`);
    }

    // Trigger browser download
    const contentType = resp.headers.get('Content-Type') || (format === 'mp4' ? 'video/mp4' : 'application/zip');
    const blob = new Blob(chunks, { type: contentType });
    const safeName = vs.activeCollection.name.replace(/\s+/g, '_');
    const contentDisp = resp.headers.get('Content-Disposition');
    let filename = format === 'mp4' ? `${safeName}.mp4` : `${safeName}_segments.zip`;
    if (contentDisp) {
      const match = contentDisp.match(/filename="?([^"]+)"?/);
      if (match) filename = match[1];
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);

    $btn.textContent = 'Downloaded!';
    setTimeout(() => { $btn.textContent = origText; }, 2000);
  } catch (e) {
    console.error('[download] exception:', e);
    alert('Download failed: ' + (e.message || e));
  } finally {
    $btn.disabled = false;
    if ($btn.textContent !== 'Downloaded!') $btn.textContent = origText;
  }
}

document.getElementById('btn-download-zip').addEventListener('click', () => downloadMedia('zip'));
document.getElementById('btn-download-mp4').addEventListener('click', () => downloadMedia('mp4'));

// ── Segment info bar & delete ─────────────────────────────────────────────
const $segInfoBar   = document.getElementById('segment-info-bar');
const $segInfoText  = document.getElementById('segment-info-text');
const $btnDeleteSeg = document.getElementById('btn-delete-segment');

function updateSegmentInfoBar(seg) {
  if (!seg || seg.type !== 'active') {
    $segInfoBar.style.display = 'none';
    return;
  }
  const dur = formatDuration(seg.end_ms - seg.start_ms);
  const size = seg.size_bytes ? formatBytes(seg.size_bytes) : '?';
  $segInfoText.textContent = `Segment #${seg.id} · ${msToTime(seg.start_ms)} – ${msToTime(seg.end_ms)} · ${dur} · ${size}`;
  $segInfoBar.style.display = 'flex';
  $btnDeleteSeg.disabled = false;
  $btnDeleteSeg.textContent = '';
  $btnDeleteSeg.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 010-2H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM6 1.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5z"/></svg> Delete Segment';
  // Store current segment id on the button for the click handler
  $btnDeleteSeg.dataset.segId = seg.id;
}

$btnDeleteSeg.addEventListener('click', async () => {
  const segId = $btnDeleteSeg.dataset.segId;
  if (!segId) return;

  const seg = vs.segments.find(s => String(s.id) === String(segId));
  const desc = seg
    ? `Segment #${segId} (${msToTime(seg.start_ms)} – ${msToTime(seg.end_ms)})`
    : `Segment #${segId}`;

  if (!confirm(`Permanently delete ${desc}?\n\nThis removes it from both local and cloud storage. This cannot be undone.`)) {
    return;
  }

  $btnDeleteSeg.disabled = true;
  $btnDeleteSeg.textContent = 'Deleting...';

  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/segments/${segId}`, {
      method: 'DELETE',
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert('Delete failed: ' + msg);
      $btnDeleteSeg.disabled = false;
      $btnDeleteSeg.textContent = 'Delete Segment';
      return;
    }

    // Remove from local state and refresh
    vs.segments = vs.segments.filter(s => String(s.id) !== String(segId));
    $segInfoBar.style.display = 'none';
    stopPlayback();

    // Re-render scrubber with remaining segments
    if (vs.segments.length > 0) {
      renderScrubber();
      $segCount.textContent = `${vs.segments.length} segments`;
      // Seek to the next segment
      const nextSeg = vs.segments[Math.min(vs.currentSegmentIdx, vs.segments.length - 1)];
      if (nextSeg) seekToTimestamp(nextSeg.start_ms);
    } else {
      $scrubTrack.innerHTML = '';
      $segCount.textContent = '0 segments';
      $playbackOvText.textContent = 'No data in this range';
      $playbackOverlay.style.display = 'flex';
      $video.style.display = 'none';
    }
  } catch (e) {
    console.error('Delete segment error:', e);
    alert('Delete failed: ' + e.message);
    $btnDeleteSeg.disabled = false;
    $btnDeleteSeg.textContent = 'Delete Segment';
  }
});

// ── Delete selection (bulk delete all segments in clip range) ─────────────
const $btnDeleteSelection = document.getElementById('btn-delete-selection');
$btnDeleteSelection.addEventListener('click', async () => {
  if (!vs.clipSelection) return;
  const { startMs, endMs } = vs.clipSelection;

  const segmentsInRange = vs.segments.filter(s =>
    s.start_ms >= startMs && s.end_ms <= endMs
  );

  const desc = `${segmentsInRange.length} segment(s) between ${msToTime(startMs)} and ${msToTime(endMs)}`;
  if (!confirm(`Permanently delete ${desc}?\n\nThis removes all segments and images in this interval from both local and cloud storage. This cannot be undone.`)) {
    return;
  }

  $btnDeleteSelection.disabled = true;
  $btnDeleteSelection.textContent = 'Deleting...';

  try {
    const params = new URLSearchParams({ start_ms: Math.floor(startMs), end_ms: Math.floor(endMs) });
    const resp = await fetch(`${apiBase}/robots/${robotId}/segments?${params}`, {
      method: 'DELETE',
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert('Delete failed: ' + msg);
      return;
    }

    const result = await resp.json();
    console.log(`Deleted ${result.deleted} segment(s)`);

    // Remove deleted segments from local state
    vs.segments = vs.segments.filter(s =>
      !(s.start_ms >= startMs && s.end_ms <= endMs)
    );
    clearClipSelection();
    stopPlayback();
    $segInfoBar.style.display = 'none';

    if (vs.segments.length > 0) {
      renderScrubber();
      $segCount.textContent = `${vs.segments.length} segments`;
      const nextSeg = vs.segments[Math.min(vs.currentSegmentIdx, vs.segments.length - 1)];
      if (nextSeg) seekToTimestamp(nextSeg.start_ms);
    } else {
      $scrubTrack.innerHTML = '';
      $segCount.textContent = '0 segments';
      $playbackOvText.textContent = 'No data in this range';
      $playbackOverlay.style.display = 'flex';
      $video.style.display = 'none';
    }
  } catch (e) {
    console.error('Delete selection error:', e);
    alert('Delete failed: ' + e.message);
  } finally {
    $btnDeleteSelection.disabled = false;
    $btnDeleteSelection.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 016 6v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm2.5 0a.5.5 0 01.5.5v6a.5.5 0 01-1 0V6a.5.5 0 01.5-.5zm3 .5a.5.5 0 00-1 0v6a.5.5 0 001 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 01-1 1H13v9a2 2 0 01-2 2H5a2 2 0 01-2-2V4h-.5a1 1 0 010-2H6a1 1 0 011-1h2a1 1 0 011 1h3.5a1 1 0 011 1zM4.118 4L4 4.059V13a1 1 0 001 1h6a1 1 0 001-1V4.059L11.882 4H4.118zM6 1.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5z"/></svg> Delete Selection';
  }
});

// ── Active dates & calendar ──────────────────────────────────────────────
let activeDatesSet = new Set(); // YYYY-MM-DD strings
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed
let calSelectStart = null; // YYYY-MM-DD
let calSelectEnd = null;

const $calGrid     = document.getElementById('cal-grid');
const $calLabel    = document.getElementById('cal-month-label');
const $calPrev     = document.getElementById('cal-prev');
const $calNext     = document.getElementById('cal-next');

async function fetchActiveDates() {
  renderCalendar();
  try {
    const resp = await fetch(`${apiBase}/robots/${robotId}/active-dates`, {signal: AbortSignal.timeout(8000)});
    if (!resp.ok) return;
    const data = await resp.json();
    activeDatesSet = new Set(data.dates || []);
    if (activeDatesSet.size > 0) {
      // Navigate to the most recent month with data
      const sorted = [...activeDatesSet].sort();
      const latest = sorted[sorted.length - 1];
      const d = new Date(latest + 'T00:00:00');
      calYear = d.getFullYear();
      calMonth = d.getMonth();
    }
    renderCalendar();
  } catch (e) {
    console.warn('Failed to fetch active dates:', e);
  }
}

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
  $calLabel.textContent = `${monthNames[calMonth]} ${calYear}`;
  $calGrid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date().toISOString().slice(0, 10);

  // Leading empty cells
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell cal-blank';
    $calGrid.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const hasData = activeDatesSet.has(dateStr);
    const isToday = dateStr === today;
    const isSelected = dateStr === calSelectStart || dateStr === calSelectEnd;
    const isInRange = calSelectStart && calSelectEnd && calSelectStart !== calSelectEnd
      && dateStr > calSelectStart && dateStr < calSelectEnd;

    const cell = document.createElement('div');
    cell.className = 'cal-cell'
      + (hasData ? ' has-data' : '')
      + (isToday ? ' is-today' : '')
      + (isSelected ? ' cal-selected' : '')
      + (isInRange ? ' cal-in-range' : '');
    cell.innerHTML = `<span class="cal-day-num">${day}</span>${hasData ? '<span class="cal-dot"></span>' : ''}`;
    cell.title = hasData ? `${dateStr} — has data` : dateStr;

    if (hasData) {
      cell.addEventListener('click', () => selectCalDate(dateStr));
    }
    $calGrid.appendChild(cell);
  }
}

$calPrev.addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
$calNext.addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

// ── Calendar overlay & date selection ────────────────────────────────────
$btnDateSelect.addEventListener('click', () => {
  $calOverlay.style.display = $calOverlay.style.display === 'none' ? 'flex' : 'none';
});

document.getElementById('cal-backdrop').addEventListener('click', () => {
  if (calSelectStart && !calSelectEnd) {
    calSelectEnd = calSelectStart;
    updateDateButtonLabel();
    loadTimeline();
  }
  $calOverlay.style.display = 'none';
});

function selectCalDate(dateStr) {
  if (!calSelectStart || (calSelectStart && calSelectEnd)) {
    // Starting new selection
    calSelectStart = dateStr;
    calSelectEnd = null;
    updateDateButtonLabel();
    renderCalendar();
  } else {
    // Second click completes selection
    calSelectEnd = dateStr;
    if (calSelectStart > calSelectEnd) {
      [calSelectStart, calSelectEnd] = [calSelectEnd, calSelectStart];
    }
    updateDateButtonLabel();
    renderCalendar();
    $calOverlay.style.display = 'none';
    loadTimeline();
  }
}

function updateDateButtonLabel() {
  if (!calSelectStart) {
    $btnDateSelect.textContent = 'Select start and end date';
  } else if (!calSelectEnd || calSelectStart === calSelectEnd) {
    $btnDateSelect.textContent = calSelectStart;
  } else {
    $btnDateSelect.textContent = calSelectStart + '  \u2192  ' + calSelectEnd;
  }
}

// ── Settings mode ─────────────────────────────────────────────────────────
const $settingsContainer = document.getElementById('settings-container');
const $btnSettings       = document.getElementById('btn-settings');
const $settingsStatus    = document.getElementById('settings-status');

// Derive mgmt API base from apiBase (replace port with 8081)
let mgmtBase = apiBase.replace(/:\d+$/, ':8081');
(async () => {
  try {
    const res = await fetch('sources.json');
    const data = await res.json();
    if (data.mgmt_url) mgmtBase = data.mgmt_url;
  } catch (_) {}
})();

$btnSettings.addEventListener('click', () => switchMode('settings'));

// Slider elements
const sliders = {
  phash_threshold:     { el: document.getElementById('s-phash-threshold'),     val: document.getElementById('v-phash-threshold'),     fmt: v => String(v) },
  phash_hash_size:     { el: document.getElementById('s-phash-hash-size'),     val: document.getElementById('v-phash-hash-size'),     fmt: v => String(v) },
  motion_threshold:    { el: document.getElementById('s-motion-threshold'),    val: document.getElementById('v-motion-threshold'),    fmt: v => Number(v).toFixed(3) },
  quiet_threshold:     { el: document.getElementById('s-quiet-threshold'),     val: document.getElementById('v-quiet-threshold'),     fmt: v => Number(v).toFixed(3) },
  histogram_threshold: { el: document.getElementById('s-histogram-threshold'), val: document.getElementById('v-histogram-threshold'), fmt: v => Number(v).toFixed(2) },
};

// Debounced PATCH — sends update 300ms after last slider change
let patchTimer = null;
let pendingPatch = {};

function queuePatch(key, value) {
  pendingPatch[key] = Number(value);
  clearTimeout(patchTimer);
  patchTimer = setTimeout(sendPatch, 300);
}

async function sendPatch() {
  const body = { ...pendingPatch };
  pendingPatch = {};
  try {
    const resp = await fetch(`${mgmtBase}/config/filter`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    $settingsStatus.textContent = 'Updated';
    $settingsStatus.style.color = 'var(--green)';
    setTimeout(() => { $settingsStatus.textContent = ''; }, 2000);
    // Sync sliders with server response
    applySnapshot(data);
  } catch (e) {
    $settingsStatus.textContent = 'Error: ' + e.message;
    $settingsStatus.style.color = '#ff3355';
    console.error('PATCH /config/filter error:', e);
  }
}

function applySnapshot(snap) {
  for (const [key, s] of Object.entries(sliders)) {
    if (snap[key] !== undefined) {
      s.el.value = snap[key];
      s.val.textContent = s.fmt(snap[key]);
    }
  }
}

// Wire up slider input events
for (const [key, s] of Object.entries(sliders)) {
  s.el.addEventListener('input', () => {
    s.val.textContent = s.fmt(s.el.value);
    queuePatch(key, s.el.value);
  });
}

// Fetch current config when entering settings mode
async function fetchFilterConfig() {
  try {
    const resp = await fetch(`${mgmtBase}/config/filter`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    applySnapshot(data);
    $settingsStatus.textContent = '';
  } catch (e) {
    $settingsStatus.textContent = 'Could not load config: ' + e.message;
    $settingsStatus.style.color = '#ff3355';
    console.error('GET /config/filter error:', e);
  }
}

// ── Ask a Question ────────────────────────────────────────────────────────
const $questionPanel  = document.getElementById('question-panel');
const $questionInput  = document.getElementById('question-input');
const $btnAsk         = document.getElementById('btn-ask-question');
const $btnSubmitQ     = document.getElementById('btn-submit-question');
$btnAsk.addEventListener('click', () => {
  const open = $questionPanel.style.display === 'none';
  $questionPanel.style.display = open ? 'flex' : 'none';
  if (open) {
    updateQuestionState();
    $questionInput.focus();
  }
});

$questionInput.addEventListener('input', updateQuestionState);

function getQuestionRange() {
  if (vs.rangeStartMs != null && vs.rangeEndMs != null && vs.segments.length > 0) {
    return { startMs: vs.rangeStartMs, endMs: vs.rangeEndMs };
  }
  if (calSelectStart) {
    const startMs = new Date(calSelectStart).getTime();
    const endDate = calSelectEnd || calSelectStart;
    const endMs   = new Date(endDate + 'T23:59:59.999').getTime();
    return { startMs, endMs };
  }
  return null;
}

function updateQuestionState() {
  const range   = getQuestionRange();
  const hasText = $questionInput.value.trim().length > 0;
  $btnSubmitQ.disabled = !(range && hasText);
}

$btnSubmitQ.addEventListener('click', () => {
  const question = $questionInput.value.trim();
  const range = getQuestionRange();
  if (!question || !range) return;

  $btnSubmitQ.disabled = true;
  $btnSubmitQ.textContent = 'Thinking...';

  const $progress = document.getElementById('qa-progress');
  const $status   = document.getElementById('qa-status');
  const $answer   = document.getElementById('qa-answer');
  $progress.style.display = 'block';
  $answer.style.display = 'none';
  $status.textContent = 'Querying segments...';
  $status.style.color = '';

  const params = new URLSearchParams({
    question,
    start_ms: range.startMs,
    end_ms:   range.endMs,
    branching_factor: 2,
    beam_width: 1,
  });

  const evtSource = new EventSource(
    `${apiBase}/robots/${robotId}/questions/stream?${params}`
  );

  evtSource.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch { return; }
    switch (data.type) {
      case 'segments_found':
        $status.textContent = `Found ${data.count} active segments`;
        break;
      case 'cache_hit':
        $status.textContent = 'Using cached summary tree — skipping rebuild';
        break;
      case 'tree_building_start':
        $status.textContent = `Building summary tree (${data.total_leaves} leaves, height ${data.height})...`;
        break;
      case 'node_summary':
        $status.textContent = `Summarizing level ${data.level} (${data.total_at_level} nodes)...`;
        break;
      case 'tree_complete':
        $status.textContent = 'Summary tree complete. Searching for answer...';
        break;
      case 'traversal_start':
        $status.textContent = 'Traversing tree to find relevant segment...';
        break;
      case 'path_chosen':
        $status.textContent = `Level ${data.level}: chose path (${(data.probability * 100).toFixed(0)}% confidence)`;
        break;
      case 'leaf_reached':
        $status.textContent = `Found relevant segment (ID: ${data.segment_id})`;
        break;
      case 'downloading_video':
        $status.textContent = 'Downloading video segment...';
        break;
      case 'stitching_videos':
        $status.textContent = `Stitching ${data.count} video segments...`;
        break;
      case 'calling_video_llm':
        $status.textContent = 'Analyzing video with AI...';
        break;
      case 'answer_ready':
        $answer.style.display = 'block';
        const segs = (data.segments || []).map(s =>
          `Segment ${s.segment_id} (${new Date(s.start_ms).toLocaleTimeString()} - ${new Date(s.end_ms).toLocaleTimeString()})`
        ).join(', ');
        const verifiedTag = data.verified === false
          ? '<span style="color:#e67e22; font-size:11px; margin-left:8px;">(unverified — video model unavailable)</span>'
          : '';
        $answer.innerHTML = `<strong>Answer:</strong>${verifiedTag} ${data.answer}<div style="margin-top:6px; font-size:11px; color:var(--text-dim);">${segs}</div>`;
        $status.textContent = data.verified === false ? 'Done (unverified)' : 'Done';
        evtSource.close();
        resetQuestionUI();
        break;
      case 'error':
        $status.textContent = `Error: ${data.message}`;
        $status.style.color = '#ff3355';
        evtSource.close();
        resetQuestionUI();
        break;
    }
  };

  evtSource.onerror = () => {
    $status.textContent = 'Connection lost';
    $status.style.color = '#ff3355';
    evtSource.close();
    resetQuestionUI();
  };
});

function resetQuestionUI() {
  $btnSubmitQ.disabled = false;
  $btnSubmitQ.textContent = 'Submit';
  updateQuestionState();
}

// ── Auto-switch to view mode if URL param says so ────────────────────────
if (initMode === 'view') {
  switchMode('view');
} else if (initMode === 'settings') {
  switchMode('settings');
}
</script>
